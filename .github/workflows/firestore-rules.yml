# Firestore Rules + Functions guards CI.
#
# What runs here (and only here):
# - `guards` job: pure-logic unit tests + syntax checks, no emulator needed.
# - `rules` job: Security Rules suite against the LOCAL Firestore emulator
#   using the demo-triply project only. No login, no production data.
#
# What NEVER happens here: no `firebase deploy`, no cloud project access,
# no secrets (the demo- project prefix keeps everything emulated; no
# service-account keys or API keys are used or printed).

name: Firestore Rules + Guards

on:
  push:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'functions/**'

jobs:
  guards:
    name: Guards unit tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint

  rules:
    name: Security Rules vs emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.31.0

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Cache Firestore Emulator JAR
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-ubuntu-tools15.31.0

      # emulators:exec starts the Firestore emulator, runs the suite, then
      # tears everything down — no manual lifecycle, no leftover processes.
      # Default emulator ports come from firebase.json; the demo- project
      # prefix guarantees emulator-only operation (no cloud access).
      - name: Rules suite on Firestore emulator
        run: >-
          firebase emulators:exec --only firestore
          --project demo-triply
          "npm --prefix functions run test:rules"
