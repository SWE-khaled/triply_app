name: triply
description: "Triply travel planning and guide discovery."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Maps
  google_maps_flutter: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.2.1

  # State management & networking
  flutter_bloc: ^9.1.1

  # Utilities
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  cloudinary_public: ^0.23.1
  file_picker: ^13.1.0

  # UI
  google_fonts: ^6.3.2
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.0.0
  iconsax_flutter: ^1.0.0
  pdf: ^3.13.1
  dropdown_search: 6.0.2

  # Payments
  dio: ^5.11.1
  webview_flutter: ^4.14.1
  pay_with_paymob: ^1.4.0
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon/Icon_app.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/icon/Icon_app.png"
    background_color: "#F8F4E9"
    theme_color: "#0E5261"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/choice_role/
    - assets/images/edits/
    - assets/images/icon/
    - assets/images/nav_bar_icons/Bold/
    - assets/images/nav_bar_icons/Linear/
    - assets/images/svg/

