name: triply
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Maps
  google_maps_flutter: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.0
  google_sign_in: ^6.2.1

  # State management & networking
  provider: ^6.1.2
  http: ^1.2.0

  # Utilities
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

assets:
   - .env
