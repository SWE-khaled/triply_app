name: triply
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Maps
  google_maps_flutter: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Firebase & Auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.2.1

  # State management & networking
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  http: ^1.6.0

  # Utilities
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  webview_flutter: ^4.14.1
  cloudinary_public: ^0.23.1
  file_picker: ^13.1.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.0.0
  iconsax_flutter: ^1.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"

  image_path: "assets/images/logo.jpg"

  adaptive_icon_background: "#F7F0DF"
  adaptive_icon_foreground: "assets/images/logo.jpg"

  ios: true

  web:
    generate: true
    image_path: "assets/images/logo.jpg"
    background_color: "#F7F0DF"
    theme_color: "#F7F0DF"

  windows:
    generate: true
    image_path: "assets/images/logo.jpg"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/images/logo.jpg"
flutter:
  uses-material-design: true

  assets:
    #- .env
    - assets/images/svg/
    - assets/images/
